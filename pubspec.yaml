name: orthogonal_pawns
description: "Orthogonal Pawns 5x5 - 12 vs 12, a checkers-style abstract board game with orthogonal-only moves."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Sound effects are optional (the app catches missing-asset errors
  # silently). To enable them, add move.wav / capture.wav / win.wav
  # under assets/sounds/ and uncomment the two lines below.
  # assets:
  #   - assets/sounds/
